[package]
name = "velo"
version = "0.4.21" # x-release-please-version
description = "Email at the speed of thought"
authors = ["Avihay"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.89"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# Required even though `src/` never names it: `tauri::generate_context!()` expands
# to code that refers to `::serde_json` in the calling crate, so removing it fails
# the build with E0433. The 2026-09-01 audit §4 listed it as an unused dependency;
# that is incorrect, and Batch A verified it by removing it and rebuilding.
serde_json = "1.0"
log = "0.4"
# NOTE: no "devtools" feature. Tauri enables DevTools automatically in debug
# builds; the feature exists only to force them ON in release, which would hand a
# debugger to a window that renders untrusted email HTML (audit P3).
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Pinned transactions (SPEC-240, approved by Jim 2026-09-02). Named directly only
# to hold a `PoolConnection<Sqlite>` from the plugin's own pool for the length of
# a transaction; it was already compiled into the app through tauri-plugin-sql at
# this exact version, so no new code enters the build. Keep the version in step
# with the plugin's — a split would mean two sqlx copies and a type mismatch on
# `DbPool`.
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "json"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "rt", "time"] }
futures = "0.3"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
# Session ids for the IMAP pool (brief E2/P15, Decision 2 — approved by Jim,
# 2026-09-01). 128 unguessable bits from the OS CSPRNG. Chosen over `rand`
# because that is all this needs: no distributions, no generators, no PRNG
# state — `getrandom` is the thin shim over the platform call and nothing more.
getrandom = "0.3"
native-tls = "0.2"
# PR E REQ-1.1: exact pin; `default-features = false` so no future default can
# add rkyv or serde; `full_encoding` is the charset table the fixture suite guards.
mail-parser = { version = "=0.11.8", default-features = false, features = ["full_encoding"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder"] }
base64 = "0.22"
utf7-imap = "0.3"
socket2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Shell"] }

[target.'cfg(target_os = "linux")'.dependencies]
tray-item = { version = "0.10.0", default-features = false, features = ["ksni"] }
