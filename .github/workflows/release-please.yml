name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Fork guard — release automation is upstream-only.
    # This fork (Pepper512/velo) is a hardening fork, not a distribution channel:
    # it holds no signing secrets, and update-homebrew.yml targets upstream's tap
    # (avihaymenahem/homebrew-velo). Left unguarded, release-please reads the fork's
    # empty release history, treats all inherited upstream commits as unreleased,
    # and tries to cut a release of someone else's work. See docs/decisions/LOG.md
    # (2026-09-01) and docs/decisions/EXCEPTIONS.md EX-007.
    if: github.repository == 'avihaymenahem/velo'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      release_id: ${{ needs.release-please.outputs.release_id }}
    secrets: inherit

  packaging:
    needs: [release-please, build-and-release]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/packaging.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  update-homebrew:
    needs: [release-please, build-and-release]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
