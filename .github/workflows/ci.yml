# Baseline PR gates — docs/methodology/04-gates.md.
# Every third-party action is pinned to a commit SHA (tag in trailing comment).
# The workflow token is read-only; nothing here writes to the repo.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two zones on purpose: west-of-UTC catches local-vs-UTC date bugs
        # (see docs/audits/2026-09-01-optimize-audit.md P12).
        tz: [UTC, America/Chicago]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install (frozen lockfile)
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        if: matrix.tz == 'UTC'
        run: npm run build

  rust:
    name: rust (clippy, build --locked, test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Frontend build (tauri-build needs frontendDist)
        run: npm ci && npm run build
      - name: Build (locked)
        working-directory: src-tauri
        run: cargo build --locked
      - name: Clippy
        working-directory: src-tauri
        # No allowances. The three pre-existing lints that EX-002 covered were
        # fixed in Batch A, so any warning is now a failure.
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: One sqlx in the graph (SPEC-240)
        working-directory: src-tauri
        # `db/tx.rs` holds a `PoolConnection<Sqlite>` taken from
        # tauri-plugin-sql's own pool, so the app's direct `sqlx` must be the
        # very same crate version the plugin compiles against. A second copy
        # would type-check as two different `Pool<Sqlite>` types at best and
        # link two SQLite stacks at worst. Grok L7 on #54.
        run: |
          copies=$(cargo tree --locked -e normal -i sqlx 2>/dev/null | grep -c '^sqlx v' || true)
          echo "sqlx copies in the graph: $copies"
          test "$copies" = "1"
      - name: Release-profile check (dev-only commands must compile out)
        working-directory: src-tauri
        # `open_devtools` and `imap_raw_fetch_diagnostic` live behind
        # `#[cfg(debug_assertions)]` and are absent from the release handler list
        # (audit P3). That arm is only type-checked when debug assertions are off,
        # so check it explicitly — otherwise a break there would ship unnoticed.
        run: cargo check --release --locked
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        # RUSTSEC-2026-0141 (lettre, Boring TLS backend) is not reachable: this
        # crate uses tokio1-native-tls. Accepted in docs/decisions/EXCEPTIONS.md EX-003.
        # RUSTSEC-2026-0235 (rkyv) and RUSTSEC-2023-0071 (rsa) are lockfile-only:
        # `cargo tree --target all -e all` contains neither crate. EX-006.
        run: >
          cargo audit
          --ignore RUSTSEC-2026-0141
          --ignore RUSTSEC-2026-0235
          --ignore RUSTSEC-2023-0071

  msrv:
    name: rust MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev
      # Pinned to the same commit as the stable job; the `toolchain` input
      # selects the declared MSRV. If this job breaks while `rust` stays green,
      # a dependency raised its MSRV past Cargo.toml's rust-version — bump the
      # declaration deliberately, don't let it drift (audit: 1.77.2 was stale
      # while lettre 0.11.23 required 1.85; this job's first run raised it to 1.89).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Frontend build (tauri-build needs frontendDist)
        run: npm ci && npm run build
      - name: cargo check on MSRV
        working-directory: src-tauri
        run: cargo check --locked

  dependency-audit:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # "high" per the vuln SLA table. EX-004 held this at "critical" to tolerate
      # markdown-it via @tiptap/pm; the Batch G bump removed markdown-it from the
      # tree entirely, so prod advisories are now zero and the gate is back where
      # the standard puts it.
      - run: npm audit --omit=dev --audit-level=high
      # Full-tree audit including devDependencies — visibility, not a gate:
      # dev advisories are tracked in the 2026-09-01 dependency audit and its
      # follow-up PRs; this step surfaces new ones without blocking merges.
      - name: npm audit (full, non-blocking)
        run: npm audit || true
      # Import-graph layering check (audit P13). Fails if any import cycle
      # contains a services/* file -- the condition that put the whole page tree
      # into the import graph of every service and made 54 cycles.
      - name: Import graph (no service cycles)
        run: node scripts/graph.mjs --check
      # Documentation counts vs. the tree (audit P20). These drifted six ways
      # because they were hand-maintained; now CI names the file and the number.
      - name: Documentation counts
        run: node scripts/docs-check.mjs --check

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
