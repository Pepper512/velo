# Baseline PR gates — docs/methodology/04-gates.md.
# Every third-party action is pinned to a commit SHA (tag in trailing comment).
# The workflow token is read-only; nothing here writes to the repo.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two zones on purpose: west-of-UTC catches local-vs-UTC date bugs
        # (see docs/audits/2026-09-01-optimize-audit.md P12).
        tz: [UTC, America/Chicago]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install (frozen lockfile)
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Production build
        if: matrix.tz == 'UTC'
        run: npm run build

  rust:
    name: rust (clippy, build --locked, test, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Frontend build (tauri-build needs frontendDist)
        run: npm ci && npm run build
      - name: Build (locked)
        working-directory: src-tauri
        run: cargo build --locked
      - name: Clippy
        working-directory: src-tauri
        # -D warnings with three named allowances = the pre-existing debt
        # recorded in docs/decisions/EXCEPTIONS.md EX-002. Any *new* lint fails.
        run: >
          cargo clippy --all-targets --locked --
          -D warnings
          -A clippy::too_many_arguments
          -A clippy::question_mark
          -A clippy::unnecessary_map_or
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: src-tauri
        # RUSTSEC-2026-0141 (lettre, Boring TLS backend) is not reachable: this
        # crate uses tokio1-native-tls. Accepted in docs/decisions/EXCEPTIONS.md EX-003.
        run: cargo audit --ignore RUSTSEC-2026-0141

  dependency-audit:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Level is "critical" until the @tiptap/pm bump lands (Batch G, EX-004);
      # then raise to "high" per the vuln SLA table.
      - run: npm audit --omit=dev --audit-level=critical

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
