name: Build & Package

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag name"
        type: string
        required: true
  # SPEC-233: run on a branch to prove a manifest or runtime change before a
  # release cuts an artefact. Without a tag nothing is uploaded.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to upload to (leave empty to only build)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Flatpak and Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Setup Flatpak remote and install SDK
        run: |
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform/x86_64/50
          flatpak --user install -y flathub org.gnome.Sdk/x86_64/50
          flatpak --user install -y flathub org.freedesktop.Sdk.Extension.node24/x86_64/25.08

      - name: Build Flatpak bundle
        # --runtime-repo lets `flatpak install velo.flatpak` fetch the runtime from
        # Flathub instead of failing with "runtime not found" (#233).
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir com.velomail.app.yml
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo repo velo.flatpak com.velomail.app

      - name: Upload Flatpak to release
        if: ${{ inputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag_name }}" velo.flatpak --clobber

  build-srpm:
    name: Build SRPM
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install RPM build tools
        run: dnf install -y rpm-build spectool rpmdevtools jq gh

      - name: Get version
        run: echo "APP_VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV

      - name: Create source tarball
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.flatpak' \
            --exclude='*.tar.gz' \
            --transform "s/^\./velo-${{ env.APP_VERSION }}/" \
            -czf "/tmp/velo-${{ env.APP_VERSION }}.tar.gz" .

      - name: Set up RPM build environment
        run: |
          rpmdev-setuptree
          # Ensure spec version matches the actual release version
          sed -i "s/^%global app_version.*/%global app_version ${{ env.APP_VERSION }}/" velo.spec
          cp velo.spec ~/rpmbuild/SPECS/
          cp "/tmp/velo-${{ env.APP_VERSION }}.tar.gz" ~/rpmbuild/SOURCES/

      - name: Build Source RPM
        run: rpmbuild -bs ~/rpmbuild/SPECS/velo.spec

      - name: Upload SRPM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag_name }}" ~/rpmbuild/SRPMS/*.src.rpm --clobber --repo ${{ github.repository }}
