# Plaintext IMAP on loopback only — throwaway test server, never exposed.
ssl = no
disable_plaintext_auth = no
mail_location = maildir:/srv/mail/%u

# Suppress UIDPLUS so UID EXPUNGE is unavailable. This is the case the brief's
# Decision 1(a) governs: Velo must flag \Deleted, expunge nothing, and say so.
imap_capability = IMAP4rev1 LITERAL+ SASL-IR LOGIN-REFERRALS ID ENABLE IDLE SORT THREAD=REFERENCES MULTIAPPEND UNSELECT CHILDREN NAMESPACE
